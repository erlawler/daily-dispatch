name = "daily-dispatch"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# account_id is inferred from your authenticated Cloudflare account (`wrangler login`).
# Set it explicitly here if you belong to multiple accounts.

[[kv_namespaces]]
binding = "TOKENS"
id = "45c265e8f3e84ea9918b35d62b5933ba"
preview_id = "9519617a5ba54ce287d616d6a683747f"

[vars]
TIMEZONE = "America/Chicago"
DASHBOARD_URL = "https://dispatch.eric-lawler.com"

# Fire hourly across the window that contains 7am Central in both CST (UTC-6) and
# CDT (UTC-5), then let the Worker decide which run actually sends.
#
# Day-of-week is deliberately absent. With `1-5` in this field the digest ran
# Sunday through Thursday and never once on Friday, so the weekday rule now lives
# in decideDigest() where it is explicit and unit-tested. The later fires are
# catch-ups: if the platform drops the 7am run, the next hour still delivers, and
# a KV day-marker keeps that at-most-once.
[triggers]
crons = ["0 12 * * *", "0 13 * * *", "0 14 * * *", "0 15 * * *"]
